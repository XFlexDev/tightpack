[package]
name = "tightpack"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Open archive format that losslessly recompresses JPEG, PNG, ZIP, gzip, PDF, WAV and more, then packs everything solid."
repository = "https://github.com/XFlexDev/tightpack"
readme = "README.md"
keywords = ["compression", "archive", "jpeg", "zip", "lossless"]
categories = ["compression", "command-line-utilities"]

[lib]
name = "tightpack"
path = "src/lib.rs"

[[bin]]
name = "tightpack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
claxon = "0.4"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flacenc = "0.5"
lepton_jpeg = "0.5"
liblzma = { version = "0.4", features = ["parallel"] }
preflate-rs = "0.7"
rayon = "1"
walkdir = "2"
zstd = "0.14"
zstd-safe = { version = "8", features = ["zstdmt"] }
filetime = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[dev-dependencies]
tempfile = "3"
